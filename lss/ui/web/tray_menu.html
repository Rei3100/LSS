<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LSS</title>
<!-- トレイのメニュー。アプリ内の右クリックメニュー（凍結Design `LSS App.dc.html` の ctx）と
     同じ文法・同じ値で描く: 見出し → EN/JP 対の行（ホバーで赤反転）→ フッターの短句。
     値は design/reference の ctxStyle / ctxHeadStyle / ctxItem / ctxFootWrap / ctxFootNoteStyle。 -->
<style>
/*__FONTS__*/
:root{
  --line:oklch(1 0 0 / 0.13); --muted:oklch(0.7 0.008 264); --dim:oklch(0.56 0.008 264);
  --text:oklch(0.96 0.003 264); --red:oklch(0.58 0.2 27);
}
html,body{margin:0;padding:0;background:transparent;overflow:hidden;color:var(--text);
  font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-user-select:none;user-select:none;cursor:default}
@keyframes lssSwap{0%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:translateY(0)}}
#menu{width:264px;display:flex;flex-direction:column;background:oklch(0.185 0.006 264);
  border:1px solid var(--line);border-top:3px solid var(--red);
  clip-path:polygon(0 0,100% 0,98.5% 100%,1.5% 100%);box-shadow:7px 9px 0 rgba(0,0,0,.45);
  overflow:hidden;transform-origin:top left;animation:lssSwap .15s cubic-bezier(.2,.9,.2,1) both}
#menu[hidden]{display:none}
.body{display:flex;flex-direction:column;animation:lssSwap .14s ease-out both}
.head{padding:9px 14px 7px;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item{display:flex;align-items:baseline;gap:9px;cursor:pointer;padding:8px 14px;color:var(--text);
  transition:background .12s ease,color .12s ease}
.item:hover,.item.focus{background:var(--red);color:#fff}
.en{font-family:'Oswald',sans-serif;font-weight:600;font-size:13.5px;letter-spacing:1.2px;white-space:nowrap}
.jp{font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:11px;opacity:.62;white-space:nowrap}
.key{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);white-space:nowrap}
.foot{padding:8px 13px 9px;border-top:1px solid var(--line);display:flex;min-width:0}
.note{font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:11px;color:oklch(0.5 0.006 264);white-space:nowrap}
</style>
</head>
<body>
<div id="menu" hidden></div>
<script>
(function () {
  const esc = (t) => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let items = [], focus = -1;
  const api = () => (window.pywebview && window.pywebview.api) || null;

  function render(d) {
    items = d.items;
    let html = `<div class="body"><div class="head">${esc(d.head)}</div>`;
    items.forEach((it, i) => {
      html += `<div class="item" data-index="${i}"><span class="en">${esc(it.en)}</span>`
        + `<span class="jp">${esc(it.jp)}</span><div style="flex:1"></div>`
        + `<span class="key">${esc(it.hint || '')}</span></div>`;
    });
    if (d.foot) html += `<div class="foot"><span class="note">${esc(d.foot)}</span></div>`;
    html += '</div>';
    const menu = document.getElementById('menu');
    const reopen = menu.hidden;
    menu.innerHTML = html;
    menu.hidden = false;
    if (reopen) { menu.style.animation = 'none'; void menu.offsetWidth; menu.style.animation = ''; }
    focus = -1;
    const box = menu.getBoundingClientRect();
    return { width: Math.ceil(box.width), height: Math.ceil(box.height) };
  }
  function setFocus(next) {
    focus = next;
    document.querySelectorAll('.item').forEach(el => el.classList.toggle('focus', Number(el.dataset.index) === focus));
  }
  function activate(index) {
    const it = items[index];
    if (it && api()) api().activate(it.action);
  }
  document.addEventListener('mousemove', () => { if (focus >= 0) setFocus(-1); });
  document.addEventListener('click', e => {
    const el = e.target.closest && e.target.closest('.item');
    if (el) activate(Number(el.dataset.index));
  });
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (!items.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); setFocus(focus < 0 ? 0 : (focus + 1) % items.length); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setFocus(focus < 0 ? items.length - 1 : (focus - 1 + items.length) % items.length); }
    else if (e.key === 'Enter') { e.preventDefault(); if (focus >= 0) activate(focus); }
    else if (e.key === 'Escape') { e.preventDefault(); api() && api().dismiss(); }
  });
  window.__menuHide = () => { document.getElementById('menu').hidden = true; };
  window.__menuRender = render;
})();
</script>
</body>
</html>
