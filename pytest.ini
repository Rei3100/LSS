[pytest]
testpaths = tests
# 試験は大きな音声を一時領域へ書く。成功した試験の分は残さず、失敗の調査に要る分だけ残す
# （`docs/research/DEV_ARTIFACT_LIFECYCLE.md` の使い捨て生成物）。
tmp_path_retention_policy = failed
markers =
    local: needs material this public tree does not carry (held machine config, private Evidence, fixtures, prior history); listed in tests/local_tests.py
