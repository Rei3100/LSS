name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  checks: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  LSS_CI_REPO: ${{ github.workspace }}
jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      class: ${{ steps.classify.outputs.class }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: _trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - id: classify
        working-directory: _trusted
        run: python scripts/ci.py classify
  public-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: _trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Public generic scan (private word list stays local)
        working-directory: _trusted
        run: |
          $deny = Join-Path $env:RUNNER_TEMP 'public-deny.txt'
          [IO.File]::WriteAllText($deny, ('LSS-PUBLICATION-' + 'CANARY-SENTINEL'))
          python -I -B gates/public_guard.py --repo $env:LSS_CI_REPO --tree-ish HEAD --denylist $deny
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci.py public-metadata
  pr-form:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: _trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python scripts/ci.py pr-form
        working-directory: _trusted
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: ./docs/scripts/check_docs.ps1
  test-linux:
    needs: classify
    if: needs.classify.outputs.class == 'B' || needs.classify.outputs.class == 'C'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      # The Product is Windows-only (it resolves bin/ffmpeg.exe); Linux runs the standard-library gate tests.
      - run: python -m pip install pytest
      - run: python -B -m pytest -q -p no:cacheprovider --noconftest tests/gates
  test-windows:
    needs: classify
    if: needs.classify.outputs.class == 'B' || needs.classify.outputs.class == 'C'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      # Same order and versions as setup-venv.ps1, with CPU wheels: hosted runners have no GPU. Every other
      # package is installed at the version in constraints.txt (scripts/freeze_constraints.py).
      - run: python -m pip install torch==2.9.1 torchaudio==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - run: python -m pip install torch==2.9.1 torchaudio==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/fetch_ffmpeg.py
      - run: python scripts/fetch_msst_models.py
      # Compile librosa's numba kernels once in one process; four test workers compiling them at the same
      # time hung test_bgm_music_facts on the hosted runner.
      - run: python -c "import numpy as np; from lss.bgm import music_facts; print(music_facts.tempo(np.random.default_rng(0).random(22050 * 8).astype('float32'), 22050)['status'])"
      # A hung test must fail the job with its stack in the log, not hold a runner for six hours.
      - run: python scripts/dev.py test --ci -j 4 -m "not local"
        timeout-minutes: 50
        env:
          PYTEST_ADDOPTS: -o faulthandler_timeout=900
      - name: Test log tail
        if: failure() || cancelled()
        run: Get-ChildItem $env:RUNNER_TEMP -Filter pytest.log -Recurse | ForEach-Object { Get-Content $_.FullName -Tail 200 }
  review-gate:
    needs: classify
    if: github.event_name != 'push' && (needs.classify.outputs.class == 'B' || needs.classify.outputs.class == 'C')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: _trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Fetch complete review snapshot and verify
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: _trusted
        run: python scripts/ci.py fetch-review
  result:
    if: always()
    needs: [classify, public-guard, pr-form, docs-check, test-linux, test-windows, review-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: _trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Every needed job must succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        working-directory: _trusted
        run: python scripts/ci.py result
